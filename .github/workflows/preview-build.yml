name: Preview build check

on:
  push:
    branches:
      - preview-staging
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_build_check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Preview private-content connectivity check (temporary)
        if: always()
        run: |
          node -e '
            (async () => {
              const url = "https://deploy-preview-2--thunderous-clafoutis-c6db2e.netlify.app/api/library-private-check";
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
                const body = await response.text();
                console.log("Preview diagnostic HTTP status:", response.status);
                console.log("Preview diagnostic response:", body.slice(0,500));
              } catch (error) {
                console.log("Preview diagnostic transport error:", error instanceof Error ? error.name : "unknown");
              }
            })()
          '
